<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Celebrar Convites Digitais</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .nao-encontrada { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    .nao-encontrada img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin: 0 auto 24px; box-shadow: var(--sombra); border: 6px solid var(--branco); }
    .nao-encontrada .script { display: block; font-size: clamp(3rem, 10vw, 4.5rem); line-height: 1; margin-bottom: .2em; }
    .nao-encontrada p { color: var(--texto-suave); max-width: 420px; margin: 0 auto 1.6em; }
  </style>
</head>
<body>
  <main class="nao-encontrada">
    <div>
      <img src="/assets/img/logo.jpg" alt="Logo Celebrar Convites Digitais" width="140" height="140">
      <span class="script">Ops!</span>
      <h1>Página não encontrada</h1>
      <p>O endereço que você acessou não existe. Volte para o início e conheça nossos convites digitais.</p>
      <a class="btn btn--whats" href="/">Voltar ao início</a>
    </div>
  </main>
</body>
</html>
